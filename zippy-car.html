<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zippy Car</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #274a6b;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    user-select: none;
  }
  #stage {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(97vw, 1600px);
    height: auto;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 0 4px #16324a, 0 10px 40px rgba(0,0,0,0.5);
    border-radius: 6px;
  }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 22px;
    pointer-events: none;
  }
  .hud-block {
    background: rgba(255, 255, 255, 0.92);
    border: 3px solid #2b2b2b;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 20px;
    font-weight: bold;
    color: #2b2b2b;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  #title-block {
    text-align: center;
    letter-spacing: 1px;
  }
  #title-block .sub {
    font-size: 12px;
    font-weight: normal;
    color: #555;
  }

  #overlay {
    position: fixed; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 30, 40, 0.55);
    color: white;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay .panel {
    background: #fff;
    color: #2b2b2b;
    border-radius: 14px;
    padding: 28px 32px;
    max-width: 420px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #overlay h1 {
    font-size: 34px;
    margin-bottom: 8px;
    color: #c0392b;
  }
  #overlay p { margin: 10px 0; line-height: 1.5; }
  #overlay button {
    margin-top: 14px;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    padding: 10px 26px;
    border-radius: 8px;
    border: none;
    background: #c0392b;
    color: white;
    cursor: pointer;
  }
  #overlay button:hover { background: #a5301f; }
  #overlay a.back {
    display: inline-block;
    margin-top: 14px;
    color: #274a6b;
    text-decoration: none;
    font-size: 14px;
  }

  #touch-controls {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 24px;
  }
  #touch-controls button {
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 3px solid #2b2b2b;
    background: rgba(255,255,255,0.85);
    font-size: 30px;
    font-weight: bold;
    color: #2b2b2b;
  }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <div id="hud">
    <div class="hud-block">Distance: <span id="distance">0</span> m</div>
    <div class="hud-block" id="title-block">ZIPPY CAR<div class="sub">a cartoon road trip</div></div>
    <div class="hud-block">Coins: <span id="coins">0</span></div>
  </div>

  <div id="touch-controls">
    <button id="btn-left">◀</button>
    <button id="btn-right">▶</button>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1>Zippy Car</h1>
      <p>Hold <b>&rarr;</b> (or tap the right button) to drive, <b>&larr;</b> to brake and reverse. Balance in the air with the arrows to land safely!</p>
      <p>Collect coins and drive as far as you can. Flip over and you'll respawn on your wheels.</p>
      <button id="start-btn">Start Driving</button><br>
      <a class="back" href="index.html">&larr; Back to the site</a>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var distanceEl = document.getElementById('distance');
  var coinsEl = document.getElementById('coins');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('start-btn');

  // ---------- input ----------
  var input = { right: false, left: false };
  window.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  });
  function bindHold(el, key) {
    var set = function (v) { return function (e) { e.preventDefault(); input[key] = v; }; };
    el.addEventListener('touchstart', set(true), { passive: false });
    el.addEventListener('touchend', set(false), { passive: false });
    el.addEventListener('mousedown', set(true));
    el.addEventListener('mouseup', set(false));
    el.addEventListener('mouseleave', set(false));
  }
  bindHold(document.getElementById('btn-right'), 'right');
  bindHold(document.getElementById('btn-left'), 'left');

  // ---------- terrain (smooth value noise) ----------
  function hash(i) {
    i = (i << 13) ^ i;
    return 1.0 - (((i * (i * i * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0);
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise1(x) {
    var i0 = Math.floor(x), i1 = i0 + 1;
    var t = smooth(x - i0);
    return hash(i0) * (1 - t) + hash(i1) * t;
  }
  var FLAT_START = 420;
  function terrainHeight(x) {
    if (x < FLAT_START) return 0;
    var xx = x - FLAT_START;
    var h = 0;
    h += noise1(xx * 0.0025) * 90;
    h += noise1(xx * 0.006 + 50) * 40;
    h += noise1(xx * 0.02 + 130) * 12;
    // ease the ramp in so it doesn't start jagged right at the flat zone
    var ease = Math.min(1, xx / 300);
    return h * ease;
  }
  var GROUND_BASE = 400;
  function groundY(worldX) { return GROUND_BASE - terrainHeight(worldX); }

  // ---------- coins ----------
  var coins = [];
  var nextCoinX = 250;
  function ensureCoins(upToX) {
    while (nextCoinX < upToX + 1200) {
      var gy = groundY(nextCoinX);
      coins.push({ x: nextCoinX, y: gy - 55 - Math.random() * 45, taken: false });
      nextCoinX += 180 + Math.random() * 220;
    }
  }

  // ---------- car ----------
  var WHEEL_BASE = 62;
  var WHEEL_R = 16;
  var GRAVITY = 1600;
  var car = {
    x: 120, y: 0, vy: 0, vx: 0, angle: 0, angVel: 0, grounded: true
  };
  function resetCar(x) {
    car.x = x; car.vx = 0; car.vy = 0; car.angle = 0; car.angVel = 0;
    car.y = groundY(x);
    car.grounded = true;
  }
  resetCar(120);

  var score = { coins: 0 };
  var crashPauseT = 0;

  function step(dt) {
    ensureCoins(car.x);

    if (crashPauseT > 0) {
      crashPauseT -= dt;
      return;
    }

    var throttle = input.right ? 1 : (input.left ? -1 : 0);

    if (car.grounded) {
      var ACCEL = 620, MAXSPEED = 480, REV_MAXSPEED = -180;
      if (throttle > 0) car.vx += ACCEL * dt;
      else if (throttle < 0) car.vx -= ACCEL * 1.3 * dt;
      else car.vx *= Math.pow(0.4, dt * 5);

      // slope effect (uphill slows you, downhill speeds you)
      car.vx -= Math.sin(car.angle) * 420 * dt;
      car.vx *= (1 - 0.15 * dt); // rolling resistance
      if (car.vx > MAXSPEED) car.vx = MAXSPEED;
      if (car.vx < REV_MAXSPEED) car.vx = REV_MAXSPEED;
    } else {
      // air control: rotate for landing
      var AIR_TURN = 3.4;
      if (input.right) car.angVel += AIR_TURN * dt;
      if (input.left) car.angVel -= AIR_TURN * dt;
      car.angVel *= (1 - 0.6 * dt);
    }

    var newX = car.x + car.vx * dt;
    if (newX < 60) newX = 60;

    var rearX = newX - Math.cos(car.angle) * (WHEEL_BASE / 2);
    var frontX = newX + Math.cos(car.angle) * (WHEEL_BASE / 2);
    var rearGY = groundY(rearX) - WHEEL_R;
    var frontGY = groundY(frontX) - WHEEL_R;
    var groundNow = (rearGY + frontGY) / 2;
    var targetAngle = Math.atan2(frontGY - rearGY, WHEEL_BASE);

    car.vy += GRAVITY * dt;
    var yPred = car.y + car.vy * dt;

    if (yPred >= groundNow) {
      car.grounded = true;
      car.y = groundNow;
      car.vy = 0;
      var da = targetAngle - car.angle;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      car.angle += da * Math.min(1, dt * 12);
      car.angVel = 0;
    } else {
      car.grounded = false;
      car.y = yPred;
      car.angle += car.angVel * dt;
    }

    car.x = newX;

    // crash: flipped and touching ground
    var norm = ((car.angle % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
    if (car.grounded && Math.abs(norm) > 2.0) {
      crashPauseT = 0.9;
      resetCar(Math.max(60, car.x - 40));
      return;
    }

    // coins
    for (var i = 0; i < coins.length; i++) {
      var c = coins[i];
      if (!c.taken && Math.abs(c.x - car.x) < 34 && Math.abs(c.y - car.y) < 46) {
        c.taken = true;
        score.coins++;
      }
    }

    distanceEl.textContent = Math.max(0, Math.round((car.x - 120) / 10));
    coinsEl.textContent = score.coins;
  }

  // ---------- rendering ----------
  var cloudSeed = [];
  for (var i = 0; i < 14; i++) {
    cloudSeed.push({ x: Math.random() * 3000, y: 40 + Math.random() * 140, s: 0.6 + Math.random() * 1 });
  }

  function drawBackground(camX) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#8fd0f0');
    grad.addColorStop(0.7, '#dff3fb');
    grad.addColorStop(1, '#f6fcff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath();
    ctx.arc(120, 90, 46, 0, Math.PI * 2);
    ctx.fill();

    // clouds (slow parallax)
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (var i = 0; i < cloudSeed.length; i++) {
      var c = cloudSeed[i];
      var sx = ((c.x - camX * 0.25) % 3000 + 3000) % 3000 - 200;
      drawCloud(sx, c.y, c.s);
    }

    // distant hills (parallax)
    ctx.fillStyle = '#bfe3c7';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var x = 0; x <= W; x += 20) {
      var wx = camX * 0.5 + x;
      var y = 300 - terrainHeight(wx * 0.7) * 0.4 - 40;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 30 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 24 * s, y + 6 * s, 22 * s, 13 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 24 * s, y + 8 * s, 20 * s, 12 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTerrain(camX) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    var step = 8;
    for (var sx = -step; sx <= W + step; sx += step) {
      var wx = camX + sx;
      ctx.lineTo(sx, groundY(wx));
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0, GROUND_BASE - 140, 0, H);
    grad.addColorStop(0, '#8a5a34');
    grad.addColorStop(1, '#5c3c22');
    ctx.fillStyle = grad;
    ctx.fill();

    // grass cap
    ctx.beginPath();
    for (var sx2 = -step; sx2 <= W + step; sx2 += step) {
      var wx2 = camX + sx2;
      var gy = groundY(wx2);
      if (sx2 === -step) ctx.moveTo(sx2, gy);
      else ctx.lineTo(sx2, gy);
    }
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#6fbf5e';
    ctx.stroke();
  }

  function drawCoins(camX) {
    for (var i = 0; i < coins.length; i++) {
      var c = coins[i];
      if (c.taken) continue;
      var sx = c.x - camX;
      if (sx < -30 || sx > W + 30) continue;
      ctx.save();
      ctx.translate(sx, c.y);
      ctx.fillStyle = '#ffd23f';
      ctx.strokeStyle = '#c9941f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#c9941f';
      ctx.font = 'bold 14px Georgia';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
      ctx.restore();
    }
  }

  // cartoon wedge-nosed two-door sports car (fictional, non-brand-specific)
  function drawCar(camX) {
    var sx = car.x - camX;
    ctx.save();
    ctx.translate(sx, car.y);
    ctx.rotate(car.angle);

    var rx = -WHEEL_BASE / 2, fx = WHEEL_BASE / 2;

    // shadow under body
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, WHEEL_R + 4, WHEEL_BASE / 2 + 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // body path (low wedge silhouette)
    ctx.beginPath();
    ctx.moveTo(rx - 16, -6);
    ctx.lineTo(rx - 20, -22);
    ctx.lineTo(rx - 8, -36);
    ctx.lineTo(-8, -42);
    ctx.lineTo(16, -42);
    ctx.lineTo(fx - 6, -30);
    ctx.lineTo(fx + 10, -16);
    ctx.lineTo(fx + 22, -6);
    ctx.lineTo(fx + 18, 4);
    ctx.lineTo(rx - 20, 4);
    ctx.closePath();
    ctx.fillStyle = '#d94a3d';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2b2b2b';
    ctx.stroke();

    // window
    ctx.beginPath();
    ctx.moveTo(-6, -38);
    ctx.lineTo(13, -38);
    ctx.lineTo(fx - 10, -28);
    ctx.lineTo(-2, -28);
    ctx.closePath();
    ctx.fillStyle = '#bfe3f2';
    ctx.fill();
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = 2;
    ctx.stroke();

    // side stripe
    ctx.strokeStyle = '#f4e04d';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(rx - 6, -12);
    ctx.lineTo(fx + 8, -12);
    ctx.stroke();

    // headlight
    ctx.fillStyle = '#fff6c8';
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(fx + 6, -12, 10, 8);
    ctx.fill();
    ctx.stroke();

    // wheels
    drawWheel(rx, WHEEL_R);
    drawWheel(fx, WHEEL_R);

    ctx.restore();
  }

  function drawWheel(x, r) {
    ctx.beginPath();
    ctx.arc(x, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#2b2b2b';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, 0, r * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = '#c9c9c9';
    ctx.fill();
    ctx.strokeStyle = '#8f8f8f';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function render() {
    var camX = car.x - W * 0.32;
    drawBackground(camX);
    drawTerrain(camX);
    drawCoins(camX);
    drawCar(camX);
  }

  // ---------- loop ----------
  var running = false;
  var lastT = null;
  function frame(t) {
    if (!running) return;
    if (lastT == null) lastT = t;
    var dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;
    step(dt);
    render();
    requestAnimationFrame(frame);
  }

  startBtn.addEventListener('click', function () {
    overlay.classList.add('hidden');
    running = true;
    lastT = null;
    requestAnimationFrame(frame);
  });

  // draw an idle preview behind the start overlay
  render();
})();
</script>
</body>
</html>
